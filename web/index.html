<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HorseTeste - Produtos</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 24px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
            margin-right: 5px;
        }

        form {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ccc;
            max-width: 500px;
        }

        form div {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eee;
        }

        .erro {
            color: #b00020;
            margin-bottom: 20px;
        }

        .sucesso {
            color: #087f23;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h1>Produtos</h1>

    <button id="btn-novo">Novo produto</button>

    <div id="mensagem"></div>

    <form id="form-produto" style="display: none;">

        <div>
            <label for="nome">Nome</label>
            <input
                type="text"
                id="nome"
                required
            >
        </div>

        <div>
            <label for="preco">Preço</label>
            <input
                type="number"
                id="preco"
                step="0.01"
                min="0"
                required
            >
        </div>

        <div>
            <label for="estoque">Estoque</label>
            <input
                type="number"
                id="estoque"
                min="0"
                required
            >
        </div>

        <button type="submit">Salvar</button>
        <button type="button" id="btn-cancelar">
            Cancelar
        </button>

    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="tabela-produtos">
        </tbody>
    </table>

    <script>

        let produtoEditandoId = null;


        const btnNovo =
            document.getElementById('btn-novo');

        const btnCancelar =
            document.getElementById('btn-cancelar');

        const formProduto =
            document.getElementById('form-produto');

        const mensagem =
            document.getElementById('mensagem');

        const tabela =
            document.getElementById('tabela-produtos');


        btnNovo.addEventListener('click', function () {

            produtoEditandoId = null;

            formProduto.reset();

            formProduto.style.display = 'block';

            document.getElementById('nome').focus();

        });


        btnCancelar.addEventListener('click', function () {

            produtoEditandoId = null;

            formProduto.reset();

            formProduto.style.display = 'none';

            mensagem.textContent = '';

        });


        async function carregarProdutos() {

            try {

                const resposta =
                    await fetch('/produtos');

                if (!resposta.ok) {
                    throw new Error(
                        'Erro ao consultar produtos.'
                    );
                }

                const produtos =
                    await resposta.json();

                tabela.innerHTML = '';

                produtos.forEach(function (produto) {

                    const linha =
                        document.createElement('tr');

                    linha.innerHTML = `
                        <td>${produto.id}</td>
                        <td>${produto.nome}</td>
                        <td>${produto.preco}</td>
                        <td>${produto.estoque}</td>
                        <td>
                            <button
                                onclick="editarProduto(${produto.id})"
                            >
                                Editar
                            </button>

                            <button
                                onclick="excluirProduto(${produto.id})"
                            >
                                Excluir
                            </button>
                        </td>
                    `;

                    tabela.appendChild(linha);

                });

            } catch (erro) {

                mensagem.textContent =
                    erro.message;

                mensagem.className = 'erro';

            }
        }


        async function editarProduto(id) {

            try {

                const resposta =
                    await fetch(
                        `/produtos/${id}`
                    );

                if (!resposta.ok) {

                    const erro =
                        await resposta.text();

                    throw new Error(erro);

                }

                const produto =
                    await resposta.json();

                produtoEditandoId =
                    produto.id;

                document.getElementById('nome').value =
                    produto.nome;

                document.getElementById('preco').value =
                    produto.preco;

                document.getElementById('estoque').value =
                    produto.estoque;

                formProduto.style.display =
                    'block';

                document.getElementById('nome').focus();

            } catch (erro) {

                mensagem.textContent =
                    erro.message;

                mensagem.className =
                    'erro';

            }
        }


        async function excluirProduto(id) {

            if (!confirm(
                'Deseja excluir este produto?'
            )) {
                return;
            }

            try {

                const resposta =
                    await fetch(
                        `/produtos/${id}`,
                        {
                            method: 'DELETE'
                        }
                    );

                if (!resposta.ok) {

                    const erro =
                        await resposta.text();

                    throw new Error(erro);

                }

                mensagem.textContent =
                    'Produto excluído com sucesso.';

                mensagem.className =
                    'sucesso';

                await carregarProdutos();

            } catch (erro) {

                mensagem.textContent =
                    erro.message;

                mensagem.className =
                    'erro';

            }
        }


        formProduto.addEventListener(
            'submit',
            async function (evento) {

                evento.preventDefault();

                mensagem.textContent = '';

                const produto = {

                    nome:
                        document.getElementById(
                            'nome'
                        ).value,

                    preco:
                        Number(
                            document.getElementById(
                                'preco'
                            ).value
                        ),

                    estoque:
                        Number(
                            document.getElementById(
                                'estoque'
                            ).value
                        )
                };


                try {

                    let resposta;


                    if (produtoEditandoId === null) {

                        resposta =
                            await fetch(
                                '/produtos',
                                {
                                    method: 'POST',

                                    headers: {
                                        'Content-Type':
                                            'application/json'
                                    },

                                    body:
                                        JSON.stringify(
                                            produto
                                        )
                                }
                            );

                    } else {

                        resposta =
                            await fetch(
                                `/produtos/${produtoEditandoId}`,
                                {
                                    method: 'PUT',

                                    headers: {
                                        'Content-Type':
                                            'application/json'
                                    },

                                    body:
                                        JSON.stringify(
                                            produto
                                        )
                                }
                            );
                    }


                    if (!resposta.ok) {

                        const erro =
                            await resposta.text();

                        throw new Error(erro);

                    }


                    if (produtoEditandoId === null) {

                        mensagem.textContent =
                            'Produto cadastrado com sucesso.';

                    } else {

                        mensagem.textContent =
                            'Produto atualizado com sucesso.';

                    }


                    mensagem.className =
                        'sucesso';

                    produtoEditandoId = null;

                    formProduto.reset();

                    formProduto.style.display =
                        'none';

                    await carregarProdutos();

                } catch (erro) {

                    mensagem.textContent =
                        erro.message;

                    mensagem.className =
                        'erro';

                }

            }
        );


        carregarProdutos();

    </script>

</body>
</html>
